# Global machine configuration. Keep this file linked from mise's global
# configuration path before running `mise bootstrap`.

[settings]
experimental = true
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink"

[env]
EMAILPROXY_CONFIG = "{{ env.HOME }}/dotfiles/emailproxy.config"
EMAILPROXY_STATE = "{{ env.HOME }}/.local/state/emailproxy"

# The small, platform-specific system prerequisite sets.
[bootstrap.packages]
"apt:git" = "latest"
"dnf:git" = "latest"
"apt:cmake" = "latest"
"dnf:cmake" = "latest"
"apt:libtool-bin" = "latest"
"apt:build-essential" = "latest"
"dnf:gcc" = "latest"
"dnf:gcc-c++" = "latest"
"dnf:make" = "latest"
"dnf:automake" = "latest"
"dnf:ninja-build" = "latest"
"apt:zip" = "latest"
"dnf:zip" = "latest"
"apt:unzip" = "latest"
"dnf:unzip" = "latest"
"apt:curl" = "latest"
"dnf:curl" = "latest"
"apt:htop" = "latest"
"dnf:htop" = "latest"
"apt:wl-clipboard" = "latest"
"dnf:wl-clipboard" = "latest"
"dnf:patch" = "latest"
"dnf:moby-engine" = "latest"
"dnf:docker-compose" = "latest"
"dnf:gdouros-symbola-fonts" = "latest"
"dnf:google-noto-color-emoji-fonts" = "latest"
"dnf:google-noto-emoji-fonts" = "latest"
"dnf:dejavu-sans-fonts" = "latest"
"dnf:dejavu-sans-mono-fonts" = "latest"
# Mail
"apt:isync" = "latest"
"apt:msmtp" = "latest"
"apt:mu4e" = "latest"
"apt:notmuch" = "latest"
"apt:libsecret-tools" = "latest"
"dnf:isync" = "latest"
"dnf:msmtp" = "latest"
"dnf:maildir-utils" = "latest"
"dnf:notmuch" = "latest"
"dnf:libsecret" = "latest"
# Desktop tools
"apt:firefox" = { state = "absent" }
"apt:firefox-esr" = { state = "absent" }
"dnf:firefox" = { state = "absent" }
"flatpak-user:org.mozilla.firefox" = "latest"
"flatpak-user:org.chromium.Chromium" = "latest"
"flatpak-user:org.keepassxc.KeePassXC" = "latest"

# Current defaults. Projects can override any of these in their own mise.toml.
[tools]
# Language runtimes
python = "latest"
ruby = { version = "latest", postinstall = "ruby bin/postinstall.rb" }
node = "latest"
java = "oracle-graalvm"
rust = "stable"
# Package management
maven = "latest"
gradle = "latest"
jbang = "latest"
bun = "latest"
uv = "latest"
# LLM and agent stuff
pi = "latest"
"npm:pi-acp" = "latest"
"npm:@agentclientprotocol/codex-acp" = "latest"
# Language servers
"npm:pyright" = "latest"
"npm:typescript-language-server" = "latest"
"rust-analyzer" = "latest"
# "github:llvm/llvm-project" = "latest"
"npm:bash-language-server" = "latest"
# Developer tooling
"github:cli/cli" = "latest"
ripgrep = "latest"
bottom = "latest"
duf = "latest"
dust = "latest"
delta = "latest"
hyperfine = "latest"
bat = { version = "latest", os = ["windows"] }
lsd = { version = "latest", os = ["windows"] }
fd = { version = "latest", os = ["windows"] }
sd = { version = "latest", os = ["windows"] }
"pypi:paatch" = { version = "latest", os = ["windows"] }
"pypi:amd-debug-tools" = { version = "latest", os = ["linux"] }
"nono" = { version = "latest", "os" = ["linux", "macos"] }
# Emacs
"github:timfel/emacs-builder" = { version = "latest", os = ["linux"], version_prefix = "emacs-bundle" }
"github:kiennq/emacs-build" = { version = "latest", os = ["windows"], asset_pattern = "*ucrt*emacs*full.zip" }
# Mail
"pypi:emailproxy" = { version = "latest", extras = ["gui"] }

[bootstrap.repos]
"~/.emacs.d" = { url = "https://github.com/timfel/.emacs.d.git" }
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm.git" }
"~/.mx/mx" = { url = "https://github.com/graalvm/mx.git" }

# Initialize exactly the submodule commit recorded by the parent repository.
[bootstrap.hooks]
pre-dotfiles = "git submodule update --init --recursive"

[dotfiles]
"~/.Xresources" = { source = ".Xresources", mode = "symlink" }
"~/.bash_profile" = { source = ".bash_profile", mode = "symlink" }
"~/.bashrc" = { source = ".bashrc", mode = "symlink" }
"~/.cline" = { source = ".cline", mode = "symlink-each" }
"~/.codex" = { source = ".codex", mode = "symlink-each", exclude = ["skills"] }
"~/.config" = { source = ".config", mode = "symlink-each" }
# Some files are just to get started, and get modified later
"~/.config/kwinrulesrc" = { source = ".config.templates/kwinrulesrc", mode = "copy" }
"~/.config/autostart/emailproxy.desktop" = { source = "autostart/emailproxy.desktop", mode = "symlink", os = ["linux"] }
"~/.mbsyncrc" = { source = ".mbsyncrc", mode = "symlink", os = ["linux"] }
"~/.msmtprc" = { source = ".msmtprc", mode = "symlink", os = ["linux"] }
"~/.notmuch-config" = { source = ".notmuch-config", mode = "template", os = ["linux"] }
# This is deliberately a symlink, not a second copy of the active config.
"~/.config/mise/config.toml" = { source = "mise.toml", mode = "symlink" }
"~/.config/mise/locks" = { source = ".mise/locks", mode = "symlink" }
"~/.config/mise/mise.lock" = { source = "mise.lock", mode = "symlink" }
"~/.gdb" = { source = ".gdb", mode = "symlink-each" }
"~/.gdbinit" = { source = ".gdbinit", mode = "symlink" }
"~/.gemrc" = { source = ".gemrc", mode = "symlink" }
"~/.gitconfig" = { source = ".gitconfig", mode = "symlink" }
"~/.gitignore" = { source = ".gitignore", mode = "symlink" }
"~/.hermes" = { source = ".hermes", mode = "symlink-each" }
"~/.hgrc" = { source = ".hgrc", mode = "symlink" }
"~/.i3" = { source = ".i3", mode = "symlink-each" }
"~/.irbrc" = { source = ".irbrc", mode = "symlink" }
# The emacs desktop link contains fully qualified paths
"~/.local/share/applications/Emacs.desktop" = { source = "Emacs.desktop.template", mode = "template", os = ["linux"] }
# This is the Breeze theme with Modus Operandi Tinted window decorations, for a fanzy emacs look
"~/.local/share/color-schemes/BreezeModusOperandiTinted.colors" = { os = ["linux"], mode = "symlink" }
# Flatpak browser policy extension points. The directory symlink is intentional: Flatpak cannot resolve a symlink on an individual policy file while mounting it.
"~/.local/share/flatpak/extension/org.chromium.Chromium.Extension.dotfiles/aarch64/1" = { source = "chromium/flatpak-extension", mode = "symlink", os = ["linux"] }
"~/.local/share/flatpak/extension/org.chromium.Chromium.Extension.dotfiles/x86_64/1" = { source = "chromium/flatpak-extension", mode = "symlink", os = ["linux"] }
"~/.local/share/flatpak/extension/org.mozilla.firefox.systemconfig/aarch64/stable" = { source = "firefox/flatpak-systemconfig", mode = "symlink", os = ["linux"] }
"~/.local/share/flatpak/extension/org.mozilla.firefox.systemconfig/x86_64/stable" = { source = "firefox/flatpak-systemconfig", mode = "symlink", os = ["linux"] }
"~/.m2" = { source = ".m2", mode = "symlink-each" }
"~/.mambarc" = { source = ".mambarc", mode = "symlink" }
"~/.mavenrc" = { source = ".mavenrc", mode = "symlink" }
"~/.pdbrc" = { source = ".pdbrc", mode = "symlink" }
"~/.screenrc" = { source = ".screenrc", mode = "symlink" }
"~/.stumpwmrc" = { source = ".stumpwmrc", mode = "symlink" }
"~/.tmux.bashrc" = { source = ".tmux.bashrc", mode = "symlink" }
"~/.tmux.conf" = { source = ".tmux.conf", mode = "symlink" }
"~/.topazini" = { source = ".topazini", mode = "symlink" }
"~/.vimrc" = { source = ".vimrc", mode = "symlink" }
"~/.xbindkeysrc" = { source = ".xbindkeysrc", mode = "symlink" }
"~/.xinitrc" = { source = ".xinitrc", mode = "symlink" }
"~/Documents/WindowsPowerShell/Microsoft.PowerShell_profile.ps1" = { source = "profile.ps1", mode = "symlink", os = ["windows"] }
# Firefox reads this user-level plist on macOS; Chromium is installed by the bootstrap task into its managed-preferences location.
"~/Library/Preferences/org.mozilla.firefox.plist" = { source = "firefox/macos/org.mozilla.firefox.plist", mode = "symlink", os = ["macos"] }
"~/bin" = { source = "bin", mode = "symlink-each" }
"~/texmf" = { source = "texmf", mode = "symlink" }

# Local mail services.
[tasks.emailproxy-auth]
description = "Authorize emailproxy"
run = '''
umask 077
mkdir -p "$EMAILPROXY_STATE"
exec emailproxy --no-gui --external-auth \
  --config-file "$EMAILPROXY_CONFIG" \
  --cache-store "$EMAILPROXY_STATE/tokens" \
  --log-file "$EMAILPROXY_STATE/auth.log"
'''

[tasks.emailproxy]
description = "Start emailproxy"
run = '''
umask 077
mkdir -p "$EMAILPROXY_STATE"

if pgrep -u "$(id -u)" -x emailproxy >/dev/null 2>&1; then
  echo "emailproxy already running"
  exit 0
fi

nohup emailproxy \
  --config-file "$EMAILPROXY_CONFIG" \
  --cache-store "$EMAILPROXY_STATE/tokens" \
  --log-file "$EMAILPROXY_STATE/emailproxy.log" \
  >/dev/null 2>&1 &
printf '%s\n' "$!" > "$EMAILPROXY_STATE/pid"
'''

[tasks.emailproxy-status]
description = "Show emailproxy status"
run = '''
pid="$(cat "$EMAILPROXY_STATE/pid" 2>/dev/null || true)"
if test -n "$pid" && kill -0 "$pid" 2>/dev/null; then
  ps -p "$pid" -o pid=,args=
else
  echo "emailproxy is not running"
fi
'''

[tasks.emailproxy-stop]
description = "Stop emailproxy"
run = '''
pid="$(cat "$EMAILPROXY_STATE/pid" 2>/dev/null || true)"
if test -n "$pid" && kill -0 "$pid" 2>/dev/null; then
  kill "$pid"
fi
rm -f "$EMAILPROXY_STATE/pid"
'''

# Native Windows-only bootstrap. `run_windows` is not executed by WSL.
[tasks.bootstrap]
description = "Install native Windows applications/resources and link the PowerShell profile"
shell = 'powershell'
run_windows = '''
$ErrorActionPreference = "Inquire"

$registryPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"

if (-not (Test-Path $registryPath)) {
    New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion" -Name "AppModelUnlock" -Force | Out-Null
}

Set-ItemProperty -Path $registryPath -Name "AllowDevelopmentWithoutDevLicense" -Value 1 -Type DWord
Set-ItemProperty -Path $registryPath -Name "DeveloperMode" -Value 1 -Type DWord
Write-Host "Developer Mode has been enabled."

Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name LongPathsEnabled -Type DWord -Value 1

$ids = @(
  "Microsoft.PowerToys", "Microsoft.WindowsTerminal.Preview", "Mozilla.Firefox",
  "SlackTechnologies.Slack", "Discord.Discord", "Zoom.Zoom", "Git.Git",
  "Microsoft.VisualStudio.2022.BuildTools", "Microsoft.VisualStudioCode",
  "Kitware.CMake", "GNU.Emacs", "Clement.bottom", "DominikReichl.KeePass",
  "GnuWin32.Zip", "7zip.7zip", "RedHat.Podman-Desktop"
)
foreach ($id in $ids) {
  $installed = winget list --id $id --exact --accept-source-agreements 2>$null |
    Select-String -SimpleMatch $id
  if (-not $installed) {
    winget install --id $id --exact --accept-source-agreements --accept-package-agreements
    if ($LASTEXITCODE -ne 0) { throw "winget failed for $id" }
  }
}

New-Item -Force -ItemType SymbolicLink -Path $Env:APPDATA\.emacs.d -Target $Env:USERPROFILE\.emacs.d
'''

[tasks.strixhalo]
description = "Update Strix Halo setup"
run = """
  amd-ttm

  read -p "How many GB should we allow the GPU to take? " mem
  if [ $? -eq 0 ]; then
     if [ -n "$mem" ]; then
       amd-ttm --set $mem
     fi
  fi

  echo Turning off amd_iommu for slight speed bump. This disables passing PCIe devices to VMs
  sudo grubby --update-kernel=ALL --args=amd_iommu=off
"""
