# Dotfiles that should not be managed by native Windows.
[dotfiles]
"~/.ssh/config" = { source = ".ssh/config", mode = "symlink" }

[bootstrap.files]
"~/.config/Nextcloud/nextcloud.cfg" = { source = ".config.templates/nextcloud.cfg" }

[bootstrap.hooks]
"pre-packages" = '''
if command -v flatpak >/dev/null 2>&1; then
  flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
fi
'''
"post-packages" = """
if command -v flatpak >/dev/null 2>&1; then
  flatpak override --user --device=all org.mozilla.firefox || true
fi
"""
"pre-dotfiles" = '''
if test -f ~/.bashrc; then
  if ! test -L ~/.bashrc; then
    rm ~/.bashrc
  fi
fi
if test -f ~/.bash_profile; then
  if ! test -L ~/.bash_profile; then
    rm ~/.bash_profile
  fi
fi
'''
