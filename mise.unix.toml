# Dotfiles that should not be managed by native Windows.
[dotfiles]
"~/.ssh/config" = { source = ".ssh/config", mode = "symlink" }

[bootstrap.directories]
"~/.config/Nextcloud" = {}

[bootstrap.hooks]
"pre-packages" = '''
# use official flathub
if command -v flatpak >/dev/null 2>&1; then
  flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
fi
# only copy the nextcloud.cfg template if we do not already have the config
if ! test -f ~/.config/Nextcloud/nextcloud.cfg; then
  cp ~/dotfiles/.config.templates/nextcloud.cfg ~/.config/Nextcloud/nextcloud.cfg
fi
'''
"post-packages" = """
# make sure flatpak firefox has all the permissions
if command -v flatpak >/dev/null 2>&1; then
  flatpak override --user --device=all org.mozilla.firefox || true
fi
"""
"pre-dotfiles" = '''
if test -f ~/.bashrc; then
  if ! test -L ~/.bashrc; then
    rm ~/.bashrc
  fi
fi
if test -f ~/.bash_profile; then
  if ! test -L ~/.bash_profile; then
    rm ~/.bash_profile
  fi
fi
'''
